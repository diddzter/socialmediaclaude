[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social-poster"
version = "0.1.0"
description = "Automated Drive-to-TikTok/Instagram posting pipeline with AI captions and music."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
